      // Bike model import
let bikeParent = null;

BABYLON.SceneLoader.ImportMesh(
  null,
  "./",
  "2024_ducati_streetfighter_v4_s.glb",
  scene,
  function (meshes) {
    // Create a parent node for the bike
    bikeParent = new BABYLON.TransformNode("bikeParent", scene);

    // Attach all meshes to parent
    meshes.forEach(mesh => {
      if (!mesh.parent) {
        mesh.parent = bikeParent;
      }
    });

    // Bike transform
    bikeParent.position = new BABYLON.Vector3(0, 0.65, 20);
    bikeParent.scaling = new BABYLON.Vector3(1.5, 1.5, 1.5);
    bikeParent.rotationQuaternion = BABYLON.Quaternion.RotationYawPitchRoll(
      -Math.PI / 2, 0, 0
    );

    // Setup cameras after bike is ready
    setupCamerasAndControls();

    console.log("✅ Bike loaded");
  }
);
      
     function setupCamerasAndControls() {
  // Far ArcRotateCamera orbiting bike
  const farCamera = new BABYLON.ArcRotateCamera(
    "farCam",
    Math.PI / 2,
    Math.PI / 3,
    15,
    bikeParent.position,
    scene
  );
  farCamera.attachControl(canvas, true);

  // Near ArcRotateCamera closer orbit
  const nearCamera = new BABYLON.ArcRotateCamera(
    "nearCam",
    Math.PI / 2,
    Math.PI / 3,
    7,
    bikeParent.position,
    scene
  );
  nearCamera.attachControl(canvas, true);

  // First-person FreeCamera
  const firstPersonCamera = new BABYLON.FreeCamera(
    "firstPersonCam",
    bikeParent.position.clone().add(new BABYLON.Vector3(0, 0.5, 0)), // eye height
    scene
  );
  firstPersonCamera.attachControl(canvas, true);

  // Start with nearCamera
  scene.activeCamera = nearCamera;

  // Camera array + index
  const cameras = [farCamera, nearCamera, firstPersonCamera];
  let currentIndex = 1;

  // Switch button
  document.getElementById("cam").addEventListener("click", () => {
    scene.activeCamera.detachControl(canvas);
    currentIndex = (currentIndex + 1) % cameras.length;
    scene.activeCamera = cameras[currentIndex];
    scene.activeCamera.attachControl(canvas, true);
  });

  // Keep firstPersonCamera synced to bike
  scene.onBeforeRenderObservable.add(() => {
    if (scene.activeCamera === firstPersonCamera) {
      // Position: follow bike with vertical offset
      firstPersonCamera.position.copyFrom(bikeParent.position).addInPlace(new BABYLON.Vector3(0, 1.4, 0.5));

      // Rotation: look forward in bike's Z-axis
      const forward = new BABYLON.Vector3(-1, 0, 0); // local forward direction
      const dir = BABYLON.Vector3.TransformNormal(forward, bikeParent.getWorldMatrix()).normalize();

      // Camera looks slightly ahead of bike, not directly on its position
      const target = bikeParent.position.add(new BABYLON.Vector3(0, 2, 0)).add(dir.scale(10));
      firstPersonCamera.setTarget(target);
    }
  });

  console.log("Bike loaded; cameras ready");
}

// Movement update in render loop
scene.onBeforeRenderObservable.add(() => {
  if (!bikeParent) return;

  if (braking) {
    speed = 0;
  } else if (moveForward) {
    speed = 1.5;
    bikeParent.position.z -= speed;
  } else if (speed > 0) {
    speed -= 0.01;
    if (speed < 0) speed = 0;
    bikeParent.position.z -= speed;
  }

  if (moveLeft) bikeParent.position.x += 0.1;
  if (moveRight) bikeParent.position.x -= 0.1;
});

const roadTexUrl = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSD62UqtitKQ-w8sAQBXeSyJiAlFuIwzDjcCVi_EY-2ekxDuulUiRKfk4M&s=10";
for (let i = 0; i < 10; i++) {
  const box = BABYLON.MeshBuilder.CreateBox("road_" + i, { size: 1.6 }, scene);
  box.position = new BABYLON.Vector3(0, -0.3, -i * 60);

  const mat = new BABYLON.StandardMaterial("mat_" + i, scene);

  tex.uScale = tex.vScale = 2;
  mat.diffuseTexture = tex;
  box.material = mat;
  box.receiveShadows = true;
}

// === ROAD CONFIG ===
const lanes = [-7, -3, 3, 7]; // X positions for 4 lanes
const roadLength = 600;        // Length after which vehicles respawn
const vehicles = [];
const vehicleTypes = ["car_01.glb","car_02.glb","car_03.glb","car_04.glb","truck_01.glb","truck_02.glb","truck_03.glb","truck_04.glb"];

// === CREATE FULL TRAFFIC ===
lanes.forEach((laneX, laneIdx) => {
  const isForward = laneIdx < 2; // first 2 lanes go forward (-Z), last 2 backward (+Z)
  
  // number of vehicles per lane
  const numVehicles = 26;

  for(let i=0; i<numVehicles; i++) {
    const zPos = isForward
      ? i * 60 + Math.random() * 30   // stagger forward vehicles along Z
      : -i * 60 - Math.random() * 30; // stagger backward vehicles along Z

    // Choose vehicle type randomly
    const file = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
    const scale = file.includes("truck") ? 0.0025 : 0.002;
    const rotation = isForward 
      ? {x:-Math.PI/2, y:Math.PI, z:0} 
      : {x:-Math.PI/2, y:0, z:0};
    const dir = isForward ? new BABYLON.Vector3(0,0,-1) : new BABYLON.Vector3(0,0,1);
    const speed = (isForward ? 1.5 : 1.2) + Math.random() * 0.5;

    BABYLON.SceneLoader.ImportMesh(
      null,
      "./",
      file,
      scene,
      (meshes) => {
        const parent = new BABYLON.TransformNode("vehicle_" + laneIdx + "_" + i, scene);
        meshes.forEach(m => m.parent = parent);

        // Set position, scale, rotation
        parent.position = new BABYLON.Vector3(laneX, 0.07, zPos);
        parent.scaling = new BABYLON.Vector3(scale, scale, scale);
        parent.rotationQuaternion = null;
        parent.rotation = new BABYLON.Vector3(rotation.x, rotation.y, rotation.z);

        // Add to vehicles array
        vehicles.push({ mesh: parent, dir: dir, speed: speed });
      }
    );
  }
});

// === VEHICLE ANIMATION LOOP ===
scene.onBeforeRenderObservable.add(() => {
  vehicles.forEach(v => {
    v.mesh.position.addInPlace(v.dir.scale(v.speed));

    // Reset when out of road
    if (v.dir.z < 0 && v.mesh.position.z < -roadLength) {
      v.mesh.position.z = 300 + Math.random() * 100; // forward respawn
    }
    if (v.dir.z > 0 && v.mesh.position.z > 100) {
      v.mesh.position.z = -roadLength - Math.random() * 100; // backward respawn
    }
  });
});

        "",
        "./",
        "shop.glb",
        scene,
        function (meshes) {
          const tree1q = meshes[0];  // first mesh from the glb
          tree1q.scaling = new BABYLON.Vector3(5, 5, 5);
          tree1q.position = new BABYLON.Vector3(50, 0.2, -250);
tree1q.rotation = new BABYLON.Vector3(0, -Math.PI / 2, 0);
          shadowGen.addShadowCaster(tree1q);

          // ✅ Use clones along the road
          
        }
      );
        
        BABYLON.SceneLoader.ImportMesh(
        "",
        "./",
        "cartoon_cyberpunk_building.glb",
        scene,
        function (meshes) {
          const tree1q = meshes[0];  // first mesh from the glb
          tree1q.scaling = new BABYLON.Vector3(5, 5, 5);
          tree1q.position = new BABYLON.Vector3(80, 0.2, -300);
tree1q.rotation = new BABYLON.Vector3(0, -Math.PI / 2, 0);
          shadowGen.addShadowCaster(tree1q);

          // ✅ Use clones along the road
          for (let i = 1; i <= 5; i++) {
            const clone = tree1q.clone("treeL_1" + i);
            clone.position = new BABYLON.Vector3(95, 0.2, i * -150);

            const clone2 = tree1q.clone("treeR_1" + i);
            clone2.position = new BABYLON.Vector3(-95, 0.2, i * -150);

            shadowGen.addShadowCaster(clone);
            shadowGen.addShadowCaster(clone2);
          }
        }
      );
        
        BABYLON.SceneLoader.ImportMesh(
        "",
        "./",
        "house.glb",
        scene,
        function (meshes) {
          const tree1q = meshes[0];  // first mesh from the glb
          tree1q.scaling = new BABYLON.Vector3(2,2,2);
          tree1q.position = new BABYLON.Vector3(80, 0.2, -800);
tree1q.rotation = new BABYLON.Vector3(0, -Math.PI / 2, 0);
          shadowGen.addShadowCaster(tree1q);

          // ✅ Use clones along the road
          for (let i = 1; i <= 5; i++) {
            const clone = tree1q.clone("treeL_1" + i);
            clone.position = new BABYLON.Vector3(175, 0.2, i * -150);

            const clone2 = tree1q.clone("treeR_1" + i);
            clone2.position = new BABYLON.Vector3(-175, 0.2, i * -150);

            shadowGen.addShadowCaster(clone);
            shadowGen.addShadowCaster(clone2);
          }
        }
      );
        
        
        
        

      scene.clearColor = new BABYLON.Color3(0.8, 0.9, 1.0);
      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
      scene.render();
    });

    window.addEventListener("resize", function () {
      engine.resize();
    });
